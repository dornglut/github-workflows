name: Reusable Rust cargo validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run repository validation authority
        shell: bash
        run: |
          set -o pipefail
          cargo +stable validate 2>&1 | tee "${RUNNER_TEMP}/validation.log"

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-validation-diagnostics
          path: ${{ runner.temp }}/validation.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove validation diagnostics
        if: always()
        run: rm -f "${RUNNER_TEMP}/validation.log"
