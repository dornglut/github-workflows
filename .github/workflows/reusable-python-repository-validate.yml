name: Reusable Python repository validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Run repository validation authority
        run: python scripts/validate.py
