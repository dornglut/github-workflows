name: Reusable Rust cargo validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Repository baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out caller repository
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Run repository validation authority
        shell: bash
        run: |
          set -o pipefail
          cargo +stable validate 2>&1 | tee validation.log

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: repository-validation-diagnostics
          path: validation.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove validation diagnostics
        if: always()
        run: rm -f validation.log
